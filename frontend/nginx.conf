server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 200m;  # default 1m rejects PDF uploads with 413

  location / {
    try_files $uri /index.html;  # SPA fallback
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_buffering off;  # tokens must reach the browser as they are generated
    proxy_read_timeout 600s;  # default 60s cuts long answers and embedding jobs
  }
}
