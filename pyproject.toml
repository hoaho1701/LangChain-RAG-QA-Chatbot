[project]
name = "langchain-rag-qa-chatbot"
version = "0.1.0"
description = "Local RAG chatbot: upload documents, ask questions (LangChain + LangGraph + Ollama)"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # Giữ nguyên các phiên bản đã kiểm chứng (xem CLAUDE.md)
    "pypdf==6.3.0",
    "chromadb==1.3.4",
    "langchain-chroma==1.0.0",
    "langchain-core==1.0.7",
    "langchain-huggingface==1.0.1",
    "langchain-ollama==1.0.0",
    "langgraph==1.0.3",
    "langgraph-checkpoint==3.0.1",
    "langgraph-prebuilt==1.0.5",
    "langgraph-sdk==0.2.9",
    "sentence-transformers==5.1.2",
    "huggingface-hub==0.36.0",
    "python-docx==1.2.0",
    "beautifulsoup4==4.15.0",
    "python-dotenv==1.2.2",
    "requests==2.32.5",
    # Khai báo trực tiếp để [tool.uv.sources] bên dưới áp dụng (torch CPU trên Linux/Docker)
    "torch>=2.5",
    # Backend API
    "fastapi",
    "uvicorn",
    "python-multipart",
    # Ghi kết quả evaluate.py (client nhẹ)
    "mlflow-skinny==2.22.5",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
]
# Chỉ đủ để chạy lint + test API trong CI: KHÔNG có torch / sentence-transformers
ci = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "python-dotenv==1.2.2",
    "langchain-core==1.0.7",
    "pytest",
    "ruff",
    "mlflow-skinny==2.22.5",
    "chromadb==1.3.4",
]

[tool.uv]
package = false          # đây là app, không phải thư viện cần build/install

# Linux (Docker) dùng torch bản CPU: bản mặc định kéo cả CUDA (nhiều GB). macOS dùng PyPI như thường.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Chọn rule rõ ràng thay vì phụ thuộc bộ mặc định của từng phiên bản ruff
select = ["E", "F", "B"]
ignore = [
    "B008",  # File(...)/Query(...)/Depends(...) trong default argument là cách dùng chuẩn của FastAPI
    "B905",  # zip(strict=...) không cần thiết ở code hiện có
]

[tool.ruff.lint.per-file-ignores]
# Các entrypoint set os.environ (TOKENIZERS_PARALLELISM, OMP_NUM_THREADS) TRƯỚC mọi import ML
"api/main.py" = ["E402"]
"evaluate.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
